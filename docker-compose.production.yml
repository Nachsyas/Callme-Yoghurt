# ==============================================================================
# Callme Yoghurt ERP Core — Production Docker Compose
# Target Profile: Low-Cost VPS (1-2 vCPU, 2GB RAM, SSD)
# Security Mandate:
# 1. Zero public database/redis exposure.
# 2. Strict private internal Docker network.
# 3. Web server binds only to localhost / reverse proxy port.
# 4. Memory caps strictly tailored for 2GB VPS total RAM.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Laravel ERP Core Application (PHP 8.3-FPM)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    image: callme-erp-core:latest
    container_name: callme_erp_app
    restart: always
    environment:
      APP_NAME: "${APP_NAME:-Callme Yoghurt ERP Core}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://erp.callmeyoghurt.com}"
      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-callme_yoghurt_prod}"
      DB_USERNAME: "${DB_USERNAME:-callme_erp_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_CLIENT: "phpredis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      CACHE_STORE: "redis"
      QUEUE_CONNECTION: "redis"
      SESSION_DRIVER: "redis"
      CRM_PII_BLIND_INDEX_KEY: "${CRM_PII_BLIND_INDEX_KEY}"
      ERP_SERVICE_TOKEN: "${ERP_SERVICE_TOKEN}"
      CHECKOUT_FINGERPRINT_KEY: "${CHECKOUT_FINGERPRINT_KEY}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET}"
      ERP_FULFILLMENT_WAREHOUSE_CODE: "${ERP_FULFILLMENT_WAREHOUSE_CODE:-WH-MAIN}"
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY}"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET}"
      OBJECT_STORAGE_ENDPOINT: "${OBJECT_STORAGE_ENDPOINT}"
      OBJECT_STORAGE_REGION: "${OBJECT_STORAGE_REGION:-us-east-1}"
      OBJECT_STORAGE_PATH_STYLE: "${OBJECT_STORAGE_PATH_STYLE:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. Nginx Web Server / Reverse Proxy
  # ----------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: callme_erp_web
    restart: always
    ports:
      # Restrict binding to localhost (or reverse proxy / Cloudflare Tunnel)
      - "127.0.0.1:${HTTP_PORT:-8000}:80"
    volumes:
      - ./backend-core/docker/nginx/callme-erp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend-core/public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 64M

  # ----------------------------------------------------------------------------
  # 3. Asynchronous Queue Worker (Single Process for 2GB VPS Profile)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    image: callme-erp-core:latest
    container_name: callme_erp_worker
    restart: always
    command: ["php", "artisan", "queue:work", "redis", "--sleep=5", "--tries=3", "--timeout=90", "--memory=128"]
    environment:
      APP_NAME: "${APP_NAME:-Callme Yoghurt ERP Core}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-callme_yoghurt_prod}"
      DB_USERNAME: "${DB_USERNAME:-callme_erp_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_CLIENT: "phpredis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      CACHE_STORE: "redis"
      QUEUE_CONNECTION: "redis"
      SESSION_DRIVER: "redis"
      CRM_PII_BLIND_INDEX_KEY: "${CRM_PII_BLIND_INDEX_KEY}"
      ERP_SERVICE_TOKEN: "${ERP_SERVICE_TOKEN}"
      CHECKOUT_FINGERPRINT_KEY: "${CHECKOUT_FINGERPRINT_KEY}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET}"
      ERP_FULFILLMENT_WAREHOUSE_CODE: "${ERP_FULFILLMENT_WAREHOUSE_CODE:-WH-MAIN}"
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 192M

  # ----------------------------------------------------------------------------
  # 4. Authoritative System of Record — PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: callme_erp_postgres
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE:-callme_yoghurt_prod}"
      POSTGRES_USER: "${DB_USERNAME:-callme_erp_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-callme_prod_secure_password_replace_me}"
    command: >
      postgres
      -c max_connections=30
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c min_wal_size=64MB
      -c max_wal_size=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M
    # Invariant: NO PORTS EXPOSED PUBLICLY

  # ----------------------------------------------------------------------------
  # 5. Ephemeral Infrastructure — Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: callme_erp_redis
    restart: always
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-callme_prod_redis_secure_password_replace_me}"
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-callme_prod_redis_secure_password_replace_me}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M
    # Invariant: NO PORTS EXPOSED PUBLICLY

networks:
  internal_net:
    name: callme_erp_internal_network
    driver: bridge

volumes:
  postgres_prod_data:
    name: callme_erp_postgres_prod_data
  redis_prod_data:
    name: callme_erp_redis_prod_data
