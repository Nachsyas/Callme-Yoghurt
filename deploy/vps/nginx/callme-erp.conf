# ==============================================================================
# Callme Yoghurt ERP Core — Nginx Virtual Host Configuration
# Server Root: /var/www/callme-erp/backend-core/public
# Upstream: unix:/run/php/php8.3-fpm.sock
# ==============================================================================

# Rate limiting zone for upstream API protection
limit_req_zone $binary_remote_addr zone=erp_api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name erp-internal.callmeyoghurt.com localhost;

    root /var/www/callme-erp/backend-core/public;
    index index.php index.html;

    charset utf-8;

    # Maximum request body size (aligned with PHP upload limit)
    client_max_body_size 32M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/callme-erp.access.log;
    error_log /var/log/nginx/callme-erp.error.log warn;

    # Primary route handler
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=erp_api_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 60s;
    }

    # Deny access to sensitive files (.env, .git, composer.*, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* /(storage|bootstrap)/.*\.php$ {
        deny all;
        return 404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|eot|ttf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
