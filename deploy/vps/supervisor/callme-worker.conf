[program:callme-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/callme-erp/backend-core/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/callme-worker.log
stopwaitsecs=3600
