# Callme Yoghurt — Local Infrastructure Compose
# NOTE: All default credentials below are strictly for local development testing.
# Production environments MUST inject cryptographically secure secrets via environment variables.

services:
  postgres:
    image: postgres:16-alpine
    container_name: callme_yoghurt_postgres
    restart: always
    networks:
      - internal_net
    ports:
      # Restrict binding to localhost to avoid exposure to external networks
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callme_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callme_dev_insecure_password}
      POSTGRES_DB: ${POSTGRES_DB:-callme_yoghurt_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: callme_yoghurt_redis
    restart: always
    networks:
      - internal_net
    ports:
      # Restrict binding to localhost
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-callme_dev_redis_insecure_password}"]
    volumes:
      - redis_data:/data

  # MongoDB is deferred per ADR-0001 (PostgreSQL is the sole primary system of record).
  # Kept under a profile so standard `docker compose up` will NOT start it.
  mongodb:
    image: mongo:7.0
    container_name: callme_yoghurt_mongodb
    profiles:
      - legacy-deferred
    restart: always
    networks:
      - internal_net
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-dev_mongo_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-dev_mongo_insecure_password}
    volumes:
      - mongodb_data:/data/db

networks:
  internal_net:
    name: callme_internal_network
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
