[global]
daemonize = no

[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

user = www-data
group = www-data

; Resource optimization for 2GB VPS:
; 10 children * ~30MB = ~300MB maximum PHP memory footprint
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
pm.process_idle_timeout = 10s

request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
